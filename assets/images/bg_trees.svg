    <!-- Tree 3 -->
    <rect x="760" y="360" width="34" height="360" rx="10" fill="#5D4037"/>
    <circle cx="777" cy="310" r="95"/>
    <circle cx="720" cy="340" r="70"/>
    <circle cx="830" cy="340" r="70"/>
    <!-- Tree 4 -->
    <rect x="1100" y="400" width="30" height="320" rx="10" fill="#5D4037"/>
